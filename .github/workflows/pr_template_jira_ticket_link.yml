name: Jira Ticket Link

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  jira-link:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Jira Ticket
        id: jira
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            // Find text between:
            // ## <JIRA TICKET NUMBER>
            // ---
            const match = body.match(
              /## <JIRA TICKET NUMBER>\s*([\s\S]*?)\s*---/
            );

            if (!match) {
              core.setFailed("Could not find Jira ticket section");
              return;
            }

            const ticket = match[1].trim();

            if (!ticket) {
              core.setFailed("Jira ticket is empty");
              return;
            }

            const jiraUrl = `https://ivarun.atlassian.net/browse/${ticket}`;

            core.notice(`Jira Ticket: ${jiraUrl}`);

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🎫 Jira Ticket: ${jiraUrl}`
            });
